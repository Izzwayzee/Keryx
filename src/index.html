<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keryx</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="brandGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff686b"/>
        <stop offset="0.55" stop-color="#ee2c39"/>
        <stop offset="1" stop-color="#a80c18"/>
      </linearGradient>
    </defs>

    <symbol id="icon-keryx" viewBox="0 0 24 24">
      <path d="M12 2.4 21.6 20.6H2.4Z" fill="url(#brandGradient)"/>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"/>
    </symbol>
    <symbol id="icon-forward" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="icon-reload" viewBox="0 0 24 24">
      <path d="M20.3 9A8.5 8.5 0 1 0 21 12"/>
      <path d="M21 3v6h-6"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="icon-home" viewBox="0 0 24 24">
      <path d="m3 10.5 9-7.5 9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="11" rx="2.5"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18"/>
      <path d="M12 3a14.5 14.5 0 0 1 0 18"/>
      <path d="M12 3a14.5 14.5 0 0 0 0 18"/>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.8 3h15a2 2 0 0 0 1.8-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/>
      <path d="M12 9v4M12 17h.01"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.35" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/>
      <circle cx="19" cy="12" r="1.35" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M5 12h14"/>
    </symbol>
    <symbol id="icon-maximize" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="1.5"/>
    </symbol>
    <symbol id="icon-restore" viewBox="0 0 24 24">
      <rect x="8" y="8" width="11" height="11" rx="1.5"/>
      <path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4.5 4.5L19 7"/>
    </symbol>
    <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
      <path d="M7 17 17 7M7 7h10v10"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="m8 5 11 7-11 7z"/>
    </symbol>
    <symbol id="icon-code" viewBox="0 0 24 24">
      <path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4z"/>
      <path d="M22 2 11 13"/>
    </symbol>
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <path d="m3.5 7 8.5 6 8.5-6"/>
    </symbol>
    <symbol id="icon-shapes" viewBox="0 0 24 24">
      <circle cx="7.5" cy="16.5" r="3.5"/>
      <rect x="13" y="13" width="7" height="7" rx="1.2"/>
      <path d="m12 3 4 7H8z"/>
    </symbol>
    <symbol id="icon-message" viewBox="0 0 24 24">
      <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.9 8.9 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5Z"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="M12 2.8c.65 4.9 3.65 7.9 8.55 8.55-4.9.65-7.9 3.65-8.55 8.55-.65-4.9-3.65-7.9-8.55-8.55C8.35 10.7 11.35 7.7 12 2.8Z"/>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M6.5 7l.8 13h9.4l.8-13M10 11v5M14 11v5"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 11v5M12 8h.01"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-keryx"></use></svg>
        </span>
        <span class="brand-word">Keryx</span>
      </div>
      <div class="titlebar-drag"></div>
      <div class="window-controls">
        <button class="titlebar-button" id="minimizeBtn" type="button" title="Свернуть" aria-label="Свернуть окно">
          <svg class="icon icon-small"><use href="#icon-minus"></use></svg>
        </button>
        <button class="titlebar-button" id="maximizeBtn" type="button" title="Развернуть" aria-label="Развернуть окно">
          <svg class="icon icon-small" id="maximizeIcon"><use href="#icon-maximize"></use></svg>
        </button>
        <button class="titlebar-button titlebar-close" id="closeBtn" type="button" title="Закрыть" aria-label="Закрыть окно">
          <svg class="icon icon-small"><use href="#icon-close"></use></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <div class="workspace">
          <div class="workspace-mark">
            <svg class="icon"><use href="#icon-keryx"></use></svg>
          </div>
          <div class="workspace-copy">
            <strong>Личное</strong>
          </div>
          <span class="tab-count" id="tabCount">1</span>
        </div>

        <div class="sidebar-label">
          <span>Открытые вкладки</span>
        </div>

        <div class="tab-list" id="tabList" role="tablist" aria-label="Открытые вкладки"></div>

        <button class="new-tab-button" id="newTabBtn" type="button" title="Новая вкладка (Ctrl+T)">
          <span class="new-tab-icon"><svg class="icon"><use href="#icon-plus"></use></svg></span>
          <span>Новая вкладка</span>
          <kbd>Ctrl T</kbd>
        </button>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer">
          <button class="engine-select" id="engineBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="engine-mark" id="engineMark">G</span>
            <span class="engine-name" id="engineName">Google</span>
            <svg class="icon icon-small engine-chevron"><use href="#icon-chevron-down"></use></svg>
          </button>
        </div>
      </aside>

      <main class="browser">
        <div class="toolbar">
          <nav class="nav-controls" aria-label="Навигация">
            <button class="icon-button" id="backBtn" type="button" title="Назад (Alt+←)" aria-label="Назад" disabled>
              <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <button class="icon-button" id="forwardBtn" type="button" title="Вперёд (Alt+→)" aria-label="Вперёд" disabled>
              <svg class="icon"><use href="#icon-forward"></use></svg>
            </button>
            <button class="icon-button" id="reloadBtn" type="button" title="Обновить (Ctrl+R)" aria-label="Обновить">
              <svg class="icon" id="reloadIcon"><use href="#icon-reload"></use></svg>
            </button>
            <button class="icon-button" id="homeBtn" type="button" title="Домой (Alt+Home)" aria-label="Домашняя страница">
              <svg class="icon"><use href="#icon-home"></use></svg>
            </button>
          </nav>

          <form class="omnibox" id="omniboxForm" autocomplete="off">
            <span class="omnibox-icon" id="omniboxIcon" title="Поиск">
              <svg class="icon"><use href="#icon-search"></use></svg>
            </span>
            <input
              id="omnibox"
              type="text"
              inputmode="url"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              placeholder="Введите адрес или поисковый запрос"
              aria-label="Адресная строка"
            >
            <span class="omnibox-badge" id="omniboxBadge" hidden>Google</span>
          </form>

          <div class="toolbar-actions">
            <button class="icon-button" id="menuBtn" type="button" title="Меню браузера" aria-label="Меню браузера" aria-haspopup="menu" aria-expanded="false">
              <svg class="icon"><use href="#icon-more"></use></svg>
            </button>
          </div>

          <div class="progress-line" id="progressLine" aria-hidden="true"><span></span></div>
        </div>

        <section class="viewport" id="viewport">
          <div class="webview-host" id="webviewHost"></div>

          <section class="newtab-view" id="newtabView">
            <div class="ambient ambient-one"></div>
            <div class="ambient ambient-two"></div>
            <div class="grain"></div>

            <div class="newtab-content">
              <div class="hero-meta">
                <span id="clock">00:00</span>
                <span class="meta-separator"></span>
                <span id="date">сегодня</span>
              </div>

              <h1 class="hero-title"><span id="greeting">Добрый вечер</span><span class="hero-dot">.</span></h1>

              <form class="start-search" id="startSearchForm" autocomplete="off">
                <span class="start-search-icon"><svg class="icon"><use href="#icon-search"></use></svg></span>
                <input
                  id="startSearch"
                  type="text"
                  inputmode="url"
                  spellcheck="false"
                  autocomplete="off"
                  autocapitalize="off"
                  placeholder="Поиск в интернете или адрес сайта"
                  aria-label="Поиск в интернете"
                >
                <button class="start-search-submit" type="submit" title="Открыть" aria-label="Открыть">
                  <svg class="icon"><use href="#icon-arrow-up-right"></use></svg>
                </button>
              </form>

              <div class="start-hint">
                <span id="startEngineLabel">Поиск в Google</span>
                <span>·</span>
                <span>Enter — открыть</span>
              </div>

              <div class="quick-links" id="quickLinks" aria-label="Быстрые ссылки"></div>
            </div>
          </section>

          <section class="error-view" id="errorView" hidden>
            <div class="error-orb">
              <svg class="icon"><use href="#icon-alert"></use></svg>
            </div>
            <span class="error-eyebrow">Страница недоступна</span>
            <h2 id="errorTitle">Не удалось открыть страницу</h2>
            <p id="errorMessage">Проверьте подключение к интернету и попробуйте снова.</p>
            <code class="error-url" id="errorUrl"></code>
            <button class="primary-button" id="retryBtn" type="button">
              <svg class="icon"><use href="#icon-reload"></use></svg>
              Попробовать снова
            </button>
          </section>

          <div class="content-loader" id="contentLoader" hidden>
            <div class="loader-mark">
              <svg class="icon"><use href="#icon-keryx"></use></svg>
            </div>
            <span>Открываем страницу</span>
          </div>

          <div class="status-pill" id="statusPill" hidden>
            <svg class="icon icon-small"><use href="#icon-globe"></use></svg>
            <span id="statusText"></span>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="popover-backdrop" id="popoverBackdrop" hidden></div>

  <div class="popover engine-menu" id="engineMenu" role="menu" hidden>
    <div class="popover-label">Поисковая система</div>
    <div id="engineOptions"></div>
  </div>

  <div class="popover app-menu" id="appMenu" role="menu" hidden>
    <button class="menu-item" type="button" data-menu-action="new-tab">
      <span>Новая вкладка</span><kbd>Ctrl T</kbd>
    </button>
    <button class="menu-item" type="button" data-menu-action="reopen-tab">
      <span>Восстановить вкладку</span><kbd>Ctrl ⇧ T</kbd>
    </button>
    <div class="menu-divider"></div>
    <div class="menu-row"><span>Масштаб</span><span id="zoomValue">100%</span></div>
    <div class="zoom-row">
      <button class="zoom-button" type="button" data-menu-action="zoom-out" title="Уменьшить">−</button>
      <button class="zoom-button zoom-reset" type="button" data-menu-action="zoom-reset">Сбросить</button>
      <button class="zoom-button" type="button" data-menu-action="zoom-in" title="Увеличить">+</button>
    </div>
    <div class="menu-divider"></div>
    <button class="menu-item" type="button" data-menu-action="devtools">
      <span>Инструменты разработчика</span><kbd>F12</kbd>
    </button>
    <button class="menu-item" type="button" data-menu-action="about">
      <span>О Keryx</span>
    </button>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="renderer.js"></script>
</body>
</html>
